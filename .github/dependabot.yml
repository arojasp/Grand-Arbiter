# Weekly PRs against develop for outdated Gradle dependencies (version catalog, AGP, Kotlin, the
# Gradle wrapper) and GitHub Actions. CI runs on each one: merge if green, close if not wanted.
# The wrapper is part of the "gradle" ecosystem: "gradle-wrapper" isn't a valid one, and an
# invalid entry made Dependabot reject the whole file, so it never ran before this was fixed.
# Dependabot reads this file from the default branch (main).
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR for the tightly coupled ones (Kotlin + its plugins + KSP), one for AndroidX, one for the rest.
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      androidx:
        patterns: ["androidx.*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
