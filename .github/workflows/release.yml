# Release: push a tag vX.Y.Z on main -> checks -> waits for your approval (environment "play")
# -> signed AAB -> Google Play INTERNAL track, available to internal testers at once.
# Production stays manual: promote the release in the Play Console after testing it.
#
# Procedure:
#   1. On develop: bump versionCode/versionName (app/build.gradle.kts) and edit distribution/whatsnew/*.
#   2. PR develop -> main, CI green, merge (merging also publishes the rules bundle, as always).
#   3. git tag vX.Y.Z <commit on main> && git push origin vX.Y.Z
#   4. Actions -> Release -> "Review deployments" -> approve "play".
#
# Needs, once (see claude/ci-release-plan.md): environment "play" with yourself as required reviewer
# and the secrets PLAY_SERVICE_ACCOUNT_JSON, UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD,
# UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # re-run for a tag: choose the tag in "Use workflow from"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # to check the tag is on main

      - name: Tag, version and release notes
        run: |
          set -eu
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::Run this from a tag (vX.Y.Z), not a branch."; exit 1; }
          tag="$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$tag is not on main. Merge develop into main first, then tag main."; exit 1; }
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          [ "$tag" = "v$name" ] || { echo "::error::Tag $tag but versionName is $name."; exit 1; }
          python3 .github/scripts/check_whatsnew.py
          echo "Releasing $name ($code)" >> "$GITHUB_STEP_SUMMARY"

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play   # waits for your approval; only this job sees the secrets
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Signed bundle
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload to Google Play (internal track)
        # Pinned to the commit of v1.1.5: this third-party action receives the Play credentials.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: es.alejandro.grandarbiter
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ github.ref_name }}
          tracks: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
